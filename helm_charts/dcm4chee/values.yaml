# Default values for dcm4chee DICOM server
# Cloud provider (gcp, aws, azure, etc.)
global:
  cloudProvider: null
  namespace: ""
  gateway:
    name: ""
    namespace: ""
    gatewayClassName: ""
  backendPolicy:
    enabled: false
    securityPolicy: ""
  httpRoute:
    enabled: false

# --- LDAP (slapd-dcm4chee) ---
ldap:
  image:
    repository: dcm4che/slapd-dcm4chee
    pullPolicy: IfNotPresent
    tag: "2.6.8-34.1"
  replicaCount: 1
  service:
    port: 389
    ldapsPort: 636
  # LDAP configuration
  organisation: "dcm4che.org"
  domain: "dcm4che.org"
  tls:
    enabled: false
    verifyClient: "never"
  readonlyUser: false
  logLevel: "256"
  # Probes
  livenessProbe:
    enabled: true
    tcpSocket:
      port: 389
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    enabled: true
    tcpSocket:
      port: 389
    initialDelaySeconds: 5
    periodSeconds: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- DCM4CHEE Arc (DICOM archive server) ---
arc:
  image:
    repository: dcm4che/dcm4chee-arc-psql
    pullPolicy: IfNotPresent
    tag: "5.34.1"
  replicaCount: 1
  service:
    port: 8080
    dicomPort: 11112
  # Archive configuration
  archiveDeviceName: "dcm4chee-arc"
  aeTitle: "DCM4CHEE"
  dicomPort: 11112
  # NodePort service for DICOM C-STORE from external modalities
  dicomNodePort:
    enabled: false  # Set to true to create NodePort service for DICOM
    nodePort: 31112  # NodePort number (30000-32767)
  # JVM settings
  javaOpts: "-Xms64m -Xmx4096m -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv4Stack=true"
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

# --- OHIF Viewer ---
ohif:
  image:
    repository: ohif/app
    pullPolicy: IfNotPresent
    tag: "v3.9.2"
  replicaCount: 1
  service:
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Probes
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 5

# --- Nginx Proxy ---
nginx:
  image:
    repository: nginx
    pullPolicy: IfNotPresent
    tag: "alpine"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Probes
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
  # URL of care backend authentication endpoint
  authBackendUrl: "http://care-backend-care-be:9000/api/care_radiology/dicom/authenticate/"
  clientMaxBodySize: "100M"

# --- DICOM Configuration ---
# Base URL for OHIF viewer to access DCM4CHEE (e.g., https://dicom.example.com)
dicomBaseUrl: ""

# --- Service Account ---
serviceAccount:
  create: true
  annotations: {}
  name: ""

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}

envFromSecret: []

# --- Secrets (set via Terraform set_sensitive) ---
secret:
  enabled: false
  data: {}
    # PostgreSQL credentials
    # POSTGRES_USER: ""
    # POSTGRES_PASSWORD: ""
    # DATABASE_URL: ""  # Optional: Full PostgreSQL connection string

    # LDAP credentials
    # LDAP_ADMIN_PASSWORD: "secret"

    # Wildfly admin credentials (optional)
    # WILDFLY_ADMIN_USER: "admin"
    # WILDFLY_ADMIN_PASSWORD: "admin"

    # GCS Storage credentials
    # DICOM_BUCKET_NAME: ""
    # GCS_ACCESS_KEY: ""        # GCS HMAC Access Key ID
    # GCS_SECRET_KEY: ""        # GCS HMAC Secret
    # GCP_PROJECT_ID: ""        # GCP Project ID for bucket creation
    # GCS_LOCATION: "us-central1"  # GCS bucket location

# --- PostgreSQL Configuration ---
# Default configuration for PostgreSQL (can be overridden in secrets)
postgres:
  host: "postgres-care-rw"
  port: "5432"
  database: "dicom"
  # User and password should be provided via secrets

# --- Google Cloud Storage Configuration ---
# Default configuration for GCS storage (can be overridden in secrets)
gcs:
  endpoint: "https://storage.googleapis.com"
  bucket: "dicom-bucket"
  # GCS HMAC access key and secret should be provided via secrets
  # For GCS, ensure you have created HMAC keys for the service account

# Domain configuration for ingress
domain: ""

# --- ConfigMap ---
configMap:
  enabled: true
  data: {}

# --- Database Migration Job ---
migration:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 600

# --- GCP Backend Policy ---
backendPolicy:
  enabled: "{{ .Values.global.backendPolicy.enabled }}"
  securityPolicy: "{{ .Values.global.backendPolicy.securityPolicy }}"
  timeoutSec: 60
  drainingTimeoutSec: 60
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    port: 80
    path: /

# --- HTTP Route ---
httpRoute:
  enabled: "{{ .Values.global.httpRoute.enabled }}"
  gatewayName: "{{ .Values.global.gateway.name }}"
  annotations: {}
  hostnames: []
