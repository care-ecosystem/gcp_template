# Default values for dcm4chee DICOM server
# Cloud provider (gcp, aws, azure, etc.)
global:
  cloudProvider: null
  namespace: ""
  gateway:
    name: ""
    namespace: ""
    gatewayClassName: ""
  backendPolicy:
    enabled: false
    securityPolicy: ""
  httpRoute:
    enabled: false

# --- LDAP (slapd-dcm4chee) ---
ldap:
  image:
    repository: dcm4che/slapd-dcm4chee
    pullPolicy: IfNotPresent
    tag: "2.6.8-34.1"
  replicaCount: 1
  service:
    port: 389
    ldapsPort: 636
  # LDAP configuration
  organisation: "dcm4che.org"
  domain: "dcm4che.org"
  # Persistent storage for LDAP data
  storage:
    enabled: false  # Set to true to use PVC instead of emptyDir
    size: 2Gi
    storageClass: ""  # Use default storage class if not specified
    endpoint: "https://storage.googleapis.com"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- DCM4CHEE Arc (DICOM archive server) ---
arc:
  image:
    repository: dcm4che/dcm4chee-arc-psql
    pullPolicy: IfNotPresent
    tag: "5.34.1"
  replicaCount: 1
  service:
    port: 8080
    httpsPort: 8443
    adminPort: 9990
    dicomPort: 11112
    hl7Port: 2575
  # Archive configuration
  archiveDeviceName: "dcm4chee-arc"
  aeTitle: "DCM4CHEE"
  dicomPort: 11112
  # NodePort service for DICOM C-STORE from external modalities
  dicomNodePort:
    enabled: false  # Set to true to create NodePort service for DICOM
    nodePort: 31112  # NodePort number (30000-32767)
  # JVM settings
  javaOpts: "-Xms64m -Xmx4096m -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv4Stack=true"
  # Persistent storage for DCM4CHEE data
  storage:
    enabled: false  # Set to true to use PVC instead of emptyDir
    size: 20Gi
    storageClass: ""  # Use default storage class if not specified
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

# --- OHIF Viewer ---
ohif:
  image:
    repository: ohif/app
    pullPolicy: IfNotPresent
    tag: "v3.9.2"
  replicaCount: 1
  service:
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- Nginx Proxy ---
nginx:
  image:
    repository: nginx
    pullPolicy: IfNotPresent
    tag: "alpine"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # URL of care backend authentication endpoint
  authBackendUrl: "http://care-backend-care-be:9000/api/care_radiology/dicom/authenticate/"
  clientMaxBodySize: "100M"

# --- DICOM Configuration ---
# Base URL for OHIF viewer to access DCM4CHEE (e.g., https://dicom.example.com)
dicomBaseUrl: ""

# --- Service Account ---
serviceAccount:
  create: true
  annotations: {}
  name: ""

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}

envFromSecret: []

# --- Secrets (set via Terraform set_sensitive) ---
secret:
  enabled: false
  data: {}
    # POSTGRES_DB: ""
    # POSTGRES_USER: ""
    # POSTGRES_PASSWORD: ""
    # POSTGRES_HOST: ""
    # DATABASE_URL: ""
    # LDAP_ADMIN_PASSWORD: "secret"
    # DICOM_BUCKET_NAME: ""
    # GCS_ACCESS_KEY: ""
    # GCS_SECRET_KEY: ""
    # MINIO_ENDPOINT: ""

# --- PostgreSQL Configuration ---
# Default configuration for PostgreSQL (can be overridden in secrets)
postgres:
  host: "postgres-care-rw"
  port: "5432"
  database: "dicom"
  # User and password should be provided via secrets

# --- MinIO Configuration ---
# Default configuration for MinIO/S3 storage (can be overridden in secrets)
minio:
  endpoint: "http://minio:9000"
  bucket: "dicom-bucket"
  # Access key and secret should be provided via secrets

# Domain configuration for ingress
domain: ""

# --- ConfigMap ---
configMap:
  enabled: true
  data: {}

# --- Database Migration Job ---
migration:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 600

# --- MinIO Bucket Initialization Job ---
minioInit:
  enabled: false  # Set to true to create DICOM bucket in MinIO
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  image:
    repository: minio/mc
    tag: "latest"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# --- GCP Backend Policy ---
backendPolicy:
  enabled: "{{ .Values.global.backendPolicy.enabled }}"
  securityPolicy: "{{ .Values.global.backendPolicy.securityPolicy }}"
  timeoutSec: 60
  drainingTimeoutSec: 60
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    port: 80
    path: /

# --- HTTP Route ---
httpRoute:
  enabled: "{{ .Values.global.httpRoute.enabled }}"
  gatewayName: "{{ .Values.global.gateway.name }}"
  annotations: {}
  hostnames: []
