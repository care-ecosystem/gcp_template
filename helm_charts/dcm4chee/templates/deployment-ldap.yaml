apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dcm4chee.fullname" . }}-ldap
  labels:
    {{- include "dcm4chee.labels" . | nindent 4 }}
    app.kubernetes.io/component: ldap
spec:
  replicas: {{ .Values.ldap.replicaCount }}
  selector:
    matchLabels:
      {{- include "dcm4chee.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ldap
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "dcm4chee.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ldap
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dcm4chee.serviceAccountName" . }}
      containers:
        - name: ldap
          image: "{{ .Values.ldap.image.repository }}:{{ .Values.ldap.image.tag }}"
          imagePullPolicy: {{ .Values.ldap.image.pullPolicy }}
          ports:
            - name: ldap
              containerPort: 389
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  ldapsearch -x -D "cn=admin,dc=dcm4che,dc=org" -w "$LDAP_ROOTPASS" -H ldap:/// \
                    -b "dcmStorageID=fs1,dicomDeviceName=dcm4chee-arc,cn=Devices,cn=DICOM Configuration,dc=dcm4che,dc=org" \
                    dcmURI | grep -q "{{ .Values.gcs.endpoint }}"
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          env:
            # LDAP Configuration
            - name: LDAP_ORGANISATION
              value: {{ .Values.ldap.organisation | quote }}
            - name: LDAP_DOMAIN
              value: {{ .Values.ldap.domain | quote }}
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dcm4chee.fullname" . }}-secret
                  key: LDAP_ADMIN_PASSWORD
            - name: LDAP_CONFIG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dcm4chee.fullname" . }}-secret
                  key: LDAP_ADMIN_PASSWORD
            - name: LDAP_ROOTPASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "dcm4chee.fullname" . }}-secret
                  key: LDAP_ADMIN_PASSWORD
            - name: LDAP_TLS
              value: {{ .Values.ldap.tls.enabled | quote }}
            - name: LDAP_TLS_VERIFY_CLIENT
              value: {{ .Values.ldap.tls.verifyClient | quote }}
            - name: LDAP_READONLY_USER
              value: {{ .Values.ldap.readonlyUser | quote }}
            - name: LDAP_LOG_LEVEL
              value: {{ .Values.ldap.logLevel | quote }}
            # GCS Storage Configuration
            - name: STORAGE_URI
              value: "jclouds:s3:{{ .Values.gcs.endpoint }}"
            - name: STORAGE_BUCKET_NAME
              value: "{{ .Values.gcs.bucket }}"
            - name: STORAGE_BUCKET_ENDPOINT
              value: "{{ .Values.gcs.endpoint }}"
            - name: STORAGE_BUCKET_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "dcm4chee.fullname" . }}-secret
                  key: GCS_ACCESS_KEY
            - name: STORAGE_BUCKET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dcm4chee.fullname" . }}-secret
                  key: GCS_SECRET_KEY
            - name: STORAGE_BUCKET_PATHSTYLE
              value: "true"
            - name: STORAGE_BUCKET_VIRTHOST
              value: "false"
            # Additional bucket configuration for LDAP init
            - name: DICOM_BUCKET_NAME
              value: "{{ .Values.gcs.bucket }}"
            - name: GCS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "dcm4chee.fullname" . }}-secret
                  key: GCS_ACCESS_KEY
            - name: GCS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "dcm4chee.fullname" . }}-secret
                  key: GCS_SECRET_KEY
            - name: LDAP_INIT_CMDS
              value: "/etc/openldap/configure.sh /etc/openldap/custom/apply-bucket-config.sh"
          volumeMounts:
            - name: ldap-data
              mountPath: /var/lib/openldap/openldap-data
            - name: ldap-config
              mountPath: /etc/openldap/slapd.d
            - name: ldif-config
              mountPath: /etc/openldap/custom
          resources:
            {{- toYaml .Values.ldap.resources | nindent 12 }}
      volumes:
        - name: ldap-data
          emptyDir: {}
        - name: ldap-config
          emptyDir: {}
        - name: ldif-config
          configMap:
            name: {{ include "dcm4chee.fullname" . }}-ldif
            defaultMode: 0755
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
